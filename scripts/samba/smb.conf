# HQ Ubuntu standalone file server. Copied to /etc/samba/smb.conf by
# scripts/hq-samba-setup.sh. Do not share /home/hqadmin.

[global]
   workgroup = WORKGROUP
   server string = hq-ubuntu-server files
   netbios name = HQ-UBUNTU
   server role = standalone server
   disable netbios = yes
   smb ports = 445

   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000
   panic action = /usr/share/samba/panic-action %d

   map to guest = never
   usershare allow guests = no
   unix password sync = no
   pam password change = no
   obey pam restrictions = no

   server min protocol = SMB2
   client min protocol = SMB2

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   show add printer wizard = no

   # LAN + Tailscale (IPv4 CGNAT + IPv6 ULA). Not a substitute for UFW.
   hosts allow = 127.0.0.1 ::1 192.168.1.0/24 100.64.0.0/10 fd7a:115c:a1e0::/48

[files]
   comment = KCW HQ drop folder
   path = /home/hqadmin/kcw-files
   browseable = yes
   read only = no
   valid users = hqadmin
   force user = hqadmin
   force group = hqadmin
   create mask = 0664
   directory mask = 0775
   veto files = /.DS_Store/Thumbs.db/
   delete veto files = yes
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:encoding = native
   fruit:nfs_aces = no
   fruit:zero_file_id = yes
   ea support = yes
